<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Ti</title>
    <!-- Nuevas Fuentes de Google: Montserrat (Limpia y moderna) y Caveat (Estilo carta a mano) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Montserrat:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <style>
        /* =========================================
           Reset y Estilos Base
        ========================================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Fondo base oscuro noche */
            background: radial-gradient(circle at center, #0a1930 0%, #020612 100%);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Montserrat', sans-serif;
            color: #ffffff;
        }

        /* Canvas para las estrellas */
        #starfield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* =========================================
           Tarjeta Glassmorphism (Efecto Vidrio)
        ========================================= */
        .glass-card {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 800px;
            min-height: 400px;
            height: auto;
            padding: 4rem 3rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            
            /* Efecto vidrio esmerilado premium */
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.02));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            
            /* Bordes delicados */
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            border-left: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 30px;
            
            /* Sombra suave y resplandor azul sutil */
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), 
                        inset 0 0 20px rgba(59, 130, 246, 0.1);
        }

        /* =========================================
           Vistas y Transiciones
        ========================================= */
        .view-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 1.5s ease, transform 1.5s ease;
        }

        #intro-view {
            opacity: 1;
            transform: translateY(0);
        }

        #message-view {
            display: none;
            opacity: 0;
            pointer-events: none; /* Evita interacciones mientras está oculto */
            transform: translateY(20px);
            width: 95%;
        }

        .fade-out {
            opacity: 0 !important;
            transform: translateY(-20px) !important;
            pointer-events: none;
        }

        .fade-in {
            opacity: 1 !important;
            transform: translateY(0) !important;
            pointer-events: auto !important;
        }

        /* =========================================
           Botón Premium
        ========================================= */
        .premium-btn {
            background: linear-gradient(135deg, rgba(30, 64, 175, 0.6), rgba(15, 23, 42, 0.8));
            border: 1px solid rgba(147, 197, 253, 0.3);
            color: #e0f2fe;
            font-family: 'Montserrat', sans-serif;
            font-size: 1.3rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            padding: 1rem 3rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 0 25px rgba(37, 99, 235, 0.4);
            position: relative;
            overflow: hidden;
            outline: none;
        }

        .premium-btn::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .premium-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(59, 130, 246, 0.7);
            border-color: rgba(147, 197, 253, 0.6);
            color: #ffffff;
        }

        .premium-btn:hover::before {
            opacity: 1;
        }

        /* Animación de latido sutil para el botón */
        @keyframes subtlePulse {
            0% { box-shadow: 0 0 20px rgba(37, 99, 235, 0.4); }
            50% { box-shadow: 0 0 35px rgba(59, 130, 246, 0.7); }
            100% { box-shadow: 0 0 20px rgba(37, 99, 235, 0.4); }
        }
        .premium-btn {
            animation: subtlePulse 3s infinite;
        }

        /* =========================================
           Texto Romántico (Máquina de Escribir)
        ========================================= */
        .romantic-text {
            font-family: 'Caveat', cursive;
            font-size: clamp(1.8rem, 4vw, 2.8rem);
            line-height: 1.4;
            color: #f8fafc;
            text-align: center;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5), 0 0 20px rgba(59, 130, 246, 0.3);
            word-wrap: break-word;
        }

        .cursor {
            display: inline-block;
            width: 2px;
            height: clamp(1.8rem, 4vw, 2.8rem);
            background-color: #93c5fd;
            vertical-align: middle;
            margin-left: 5px;
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Responsividad */
        @media (max-width: 600px) {
            .glass-card { padding: 2rem 1.5rem; }
            .premium-btn { font-size: 1.1rem; padding: 0.8rem 2.5rem; }
        }
    </style>
</head>
<body>

    <!-- Canvas para el cielo estrellado -->
    <canvas id="starfield"></canvas>

    <!-- Tarjeta Glassmorphism -->
    <div class="glass-card">
        
        <!-- Vista Inicial: Botón -->
        <div id="intro-view" class="view-container">
            <button class="premium-btn" onclick="startExperience()">Para ti, Fer</button>
        </div>

        <!-- Vista del Mensaje: Texto animado -->
        <div id="message-view" class="view-container">
            <div class="romantic-text" id="typewriter-container">
                <span id="text-output"></span><span class="cursor"></span>
            </div>
        </div>

    </div>

    <script>
        /* =========================================
           1. SISTEMA DEL CIELO ESTRELLADO (CANVAS)
        ========================================= */
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let stars = [];
        let shootingStars = [];

        // Ajustar el tamaño del canvas al tamaño de la ventana
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Clase Estrella Normal
        class Star {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 1.5 + 0.5; // Tamaño pequeño y delicado
                this.baseAlpha = Math.random() * 0.5 + 0.1; // Brillo base
                this.alpha = this.baseAlpha;
                this.twinkleSpeed = Math.random() * 0.02 + 0.005;
                this.twinkleDir = Math.random() > 0.5 ? 1 : -1;
                // Tonos ligeramente azulados o blancos
                this.color = Math.random() > 0.8 ? 'rgba(173, 216, 230,' : 'rgba(255, 255, 255,'; 
            }

            update() {
                // Efecto de titileo (twinkle)
                this.alpha += this.twinkleSpeed * this.twinkleDir;
                if (this.alpha >= 1 || this.alpha <= this.baseAlpha / 2) {
                    this.twinkleDir *= -1;
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `${this.color}${this.alpha})`;
                ctx.fill();
            }
        }

        // Clase Estrella Fugaz
        class ShootingStar {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = 0;
                this.len = Math.random() * 80 + 40;
                this.speed = Math.random() * 10 + 6;
                this.size = Math.random() * 1.5 + 0.5;
                this.active = false;
                // Ángulo diagonal (cayendo hacia abajo a la derecha)
                this.angle = Math.PI / 4; 
            }

            spawn() {
                this.active = true;
                this.x = Math.random() * width * 1.5 - width*0.5; 
                this.y = -50;
            }

            update() {
                if (this.active) {
                    this.x += Math.cos(this.angle) * this.speed;
                    this.y += Math.sin(this.angle) * this.speed;
                    
                    // Si sale de la pantalla, desactivar
                    if (this.y > height || this.x > width) {
                        this.active = false;
                        this.reset();
                    }
                }
            }

            draw() {
                if (this.active) {
                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y);
                    ctx.lineTo(this.x - Math.cos(this.angle) * this.len, this.y - Math.sin(this.angle) * this.len);
                    ctx.lineWidth = this.size;
                    
                    // Gradiente para la cola de la estrella fugaz
                    let gradient = ctx.createLinearGradient(this.x, this.y, this.x - Math.cos(this.angle) * this.len, this.y - Math.sin(this.angle) * this.len);
                    gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
                    gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
                    
                    ctx.strokeStyle = gradient;
                    ctx.stroke();
                }
            }
        }

        // Inicializar cielo estrellado
        function initStars() {
            // Crear unas 200 estrellas
            for (let i = 0; i < 200; i++) {
                stars.push(new Star());
            }
            // Crear 3 posibles estrellas fugaces
            for (let i = 0; i < 3; i++) {
                shootingStars.push(new ShootingStar());
            }
        }

        // Bucle de animación del Canvas
        function animateCanvas() {
            // Limpiar canvas en cada frame
            ctx.clearRect(0, 0, width, height);

            // Dibujar estrellas normales
            stars.forEach(star => {
                star.update();
                star.draw();
            });

            // Lógica de estrellas fugaces
            shootingStars.forEach(sStar => {
                // Probabilidad aleatoria muy baja de que aparezca
                if (!sStar.active && Math.random() < 0.005) {
                    sStar.spawn();
                }
                sStar.update();
                sStar.draw();
            });

            requestAnimationFrame(animateCanvas);
        }

        initStars();
        animateCanvas();


        /* =========================================
           2. LÓGICA DE INTERACCIÓN Y MENSAJE
        ========================================= */
        const messageText = "Me gustas muchoteeee Feeeerrr, desde la primera vez que salimos me gustó demasiado estar contigo y el match que hicimos fue muy rapido ❤️.<br><br>No quiero buscar a nadie más porque estoy decidido a darlo todo por ti, en verdad te quiero muchisimOooOOoOOo";
        
        let charIndex = 0;
        let isTyping = false;
        const textOutput = document.getElementById("text-output");

        function startExperience() {
            if (isTyping) return;
            
            const introView = document.getElementById("intro-view");
            const messageView = document.getElementById("message-view");

            // Desvanecer el botón
            introView.classList.add("fade-out");

            // Esperar a que termine la animación de salida
            setTimeout(() => {
                introView.style.display = "none";
                
                // Mostrar el texto y forzar renderizado para iniciar transición
                messageView.style.display = "flex";
                void messageView.offsetWidth; 
                
                messageView.classList.add("fade-in");
                
                isTyping = true;
                // Iniciar máquina de escribir tras un breve respiro
                setTimeout(typeWriterEffect, 500);
            }, 1000); // Acortamos la transición inicial
        }

        function typeWriterEffect() {
            if (charIndex < messageText.length) {
                // Manejar etiquetas HTML completas (como <br>) para no imprimir < b r > letra por letra
                if (messageText.charAt(charIndex) === '<') {
                    let tag = "";
                    while (messageText.charAt(charIndex) !== '>' && charIndex < messageText.length) {
                        tag += messageText.charAt(charIndex);
                        charIndex++;
                    }
                    tag += '>';
                    textOutput.innerHTML += tag;
                    charIndex++;
                } else {
                    textOutput.innerHTML += messageText.charAt(charIndex);
                    charIndex++;
                }
                
                // Variar un poco la velocidad, ajustada a tu gusto (20ms a 60ms)
                let randomPace = Math.floor(Math.random() * (60 - 20 + 1)) + 20;
                setTimeout(typeWriterEffect, randomPace);
            }
        }
    </script>
</body>
</html>
